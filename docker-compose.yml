name: heremita

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: heremita
      POSTGRES_PASSWORD: heremita
      POSTGRES_DB: heremita
    ports:
      # Loopback only: the development credentials are public. 5433 belongs to another project.
      - '127.0.0.1:5434:5432'
    volumes:
      # Since PostgreSQL 18 the image keeps its data under /var/lib/postgresql/<major>/,
      # so the volume is mounted one level above the old .../data path.
      - postgres-data:/var/lib/postgresql
      # Runs once, when the volume is empty: creates the heremita_test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: during first-time initialisation the entrypoint runs a
      # temporary server on the Unix socket only, which must not count as healthy.
      test: ['CMD', 'pg_isready', '--host=127.0.0.1', '--username=heremita', '--dbname=heremita']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

volumes:
  postgres-data:
