# Render blueprint for the Heremita API (free plan).
# The web app is deployed separately on Vercel and the database lives on Neon.
services:
  - type: web
    name: heremita-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:shared && pnpm --filter @heremita/api build
    # Free instances have no pre-deploy step, so migrations run right before the server starts.
    startCommand: pnpm --filter @heremita/api db:deploy && pnpm --filter @heremita/api start
    healthCheckPath: /api/v1/health
    # Deploy a commit on main only once every GitHub check on it has passed
    # (.github/workflows/ci.yml: checks + e2e). Replaces the deprecated autoDeploy.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Neon connection string (direct, not pooled, so migrations work).
      - key: DATABASE_URL
        sync: false
      # The Vercel URL of the web app, e.g. https://heremita.vercel.app
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      # Vercel's rewrite + Render's load balancer.
      - key: TRUST_PROXY
        value: '2'
      - key: GEOCODING_PROVIDER
        value: photon
      - key: PHOTON_URL
        value: https://photon.komoot.io
      - key: ROUTING_PROVIDER
        value: osrm
      - key: OSRM_URL
        value: https://routing.openstreetmap.de
      # AI place suggestions: "off" until the key is set, then "claude" (README, AI place suggestions).
      - key: AI_PROVIDER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_LIMIT
        value: '100'
      - key: DEMO_PASSWORD
        generateValue: true
      # Same value as SERVER_FETCH_SECRET on Vercel (openssl rand -base64 32).
      # The web server signs the visitor's address with it; required in production.
      - key: SERVER_FETCH_SECRET
        sync: false
